<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Retail sales dashboard concept">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F1622" />
      <stop offset="100%" stop-color="#080C13" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2E8DFF" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <rect width="800" height="520" rx="18" fill="url(#panel)" stroke="#1E2A3A" />

  <!-- title bar -->
  <circle cx="30" cy="28" r="4.5" fill="#2E8DFF" />
  <circle cx="46" cy="28" r="4.5" fill="#14B8A6" />
  <circle cx="62" cy="28" r="4.5" fill="#222C3A" />
  <text x="86" y="33" font-family="Inter, Segoe UI, sans-serif" font-size="12" fill="#64748B">
    Retail Sales Performance · FY 2025-26
  </text>

  <!-- KPI tiles -->
  <g>
    <rect x="28" y="54" width="176" height="86" rx="12" fill="#131C29" stroke="#1E2A3A" />
    <text x="44" y="78" font-family="Inter, sans-serif" font-size="10" fill="#64748B">TOTAL REVENUE</text>
    <text x="44" y="108" font-family="Sora, Inter, sans-serif" font-size="24" font-weight="700" fill="#E6EDF7">₹ 4.82 Cr</text>
    <text x="44" y="127" font-family="Inter, sans-serif" font-size="11" fill="#14B8A6">▲ 12.4% YoY</text>
  </g>
  <g>
    <rect x="216" y="54" width="176" height="86" rx="12" fill="#131C29" stroke="#1E2A3A" />
    <text x="232" y="78" font-family="Inter, sans-serif" font-size="10" fill="#64748B">GROSS MARGIN</text>
    <text x="232" y="108" font-family="Sora, Inter, sans-serif" font-size="24" font-weight="700" fill="#E6EDF7">31.6%</text>
    <text x="232" y="127" font-family="Inter, sans-serif" font-size="11" fill="#14B8A6">▲ 2.1 pts</text>
  </g>
  <g>
    <rect x="404" y="54" width="176" height="86" rx="12" fill="#131C29" stroke="#1E2A3A" />
    <text x="420" y="78" font-family="Inter, sans-serif" font-size="10" fill="#64748B">TARGET VARIANCE</text>
    <text x="420" y="108" font-family="Sora, Inter, sans-serif" font-size="24" font-weight="700" fill="#E6EDF7">+4.3%</text>
    <text x="420" y="127" font-family="Inter, sans-serif" font-size="11" fill="#14B8A6">▲ ahead of plan</text>
  </g>
  <g>
    <rect x="592" y="54" width="180" height="86" rx="12" fill="#131C29" stroke="#1E2A3A" />
    <text x="608" y="78" font-family="Inter, sans-serif" font-size="10" fill="#64748B">ACTIVE STORES</text>
    <text x="608" y="108" font-family="Sora, Inter, sans-serif" font-size="24" font-weight="700" fill="#E6EDF7">248</text>
    <text x="608" y="127" font-family="Inter, sans-serif" font-size="11" fill="#2E8DFF">across 12 regions</text>
  </g>

  <!-- bar chart: revenue by region -->
  <rect x="28" y="160" width="470" height="230" rx="12" fill="#0C121C" stroke="#1E2A3A" />
  <text x="44" y="184" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Revenue by Region</text>
  <g fill="#2E8DFF">
    <rect x="56" y="330" width="34" height="42" rx="4" opacity="0.9" />
    <rect x="106" y="292" width="34" height="80" rx="4" opacity="0.9" />
    <rect x="156" y="252" width="34" height="120" rx="4" opacity="0.9" />
    <rect x="206" y="308" width="34" height="64" rx="4" opacity="0.9" />
    <rect x="256" y="228" width="34" height="144" rx="4" opacity="0.9" />
    <rect x="306" y="268" width="34" height="104" rx="4" opacity="0.9" />
    <rect x="356" y="212" width="34" height="160" rx="4" opacity="0.9" />
    <rect x="406" y="282" width="34" height="90" rx="4" opacity="0.9" />
    <rect x="456" y="242" width="34" height="130" rx="4" opacity="0.9" />
  </g>
  <line x1="44" y1="372" x2="482" y2="372" stroke="#22303F" />
  <g font-family="Inter, sans-serif" font-size="9" fill="#475569" text-anchor="middle">
    <text x="73" y="386">S</text>
    <text x="123" y="386">NE</text>
    <text x="173" y="386">E</text>
    <text x="223" y="386">C</text>
    <text x="273" y="386">W</text>
    <text x="323" y="386">NW</text>
    <text x="373" y="386">S</text>
    <text x="423" y="386">EC</text>
    <text x="473" y="386">SC</text>
  </g>

  <!-- donut: category share -->
  <rect x="510" y="160" width="262" height="230" rx="12" fill="#0C121C" stroke="#1E2A3A" />
  <text x="526" y="184" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Category Share</text>
  <g transform="translate(600,282)">
    <circle r="52" fill="none" stroke="#1E2A3A" stroke-width="26" />
    <circle r="52" fill="none" stroke="#2E8DFF" stroke-width="26" stroke-dasharray="163 327" stroke-dashoffset="0" transform="rotate(-90)" />
    <circle r="52" fill="none" stroke="#14B8A6" stroke-width="26" stroke-dasharray="105 327" stroke-dashoffset="-163" transform="rotate(-90)" />
    <circle r="52" fill="none" stroke="#7DB6FF" stroke-width="26" stroke-dasharray="59 327" stroke-dashoffset="-268" transform="rotate(-90)" />
    <text y="5" text-anchor="middle" font-family="Sora, sans-serif" font-size="16" font-weight="700" fill="#E6EDF7">4.82Cr</text>
  </g>
  <g font-family="Inter, sans-serif" font-size="9" fill="#64748B">
    <rect x="672" y="234" width="9" height="9" rx="2" fill="#2E8DFF" /><text x="687" y="242">Grocery 50%</text>
    <rect x="672" y="256" width="9" height="9" rx="2" fill="#14B8A6" /><text x="687" y="264">Personal Care 32%</text>
    <rect x="672" y="278" width="9" height="9" rx="2" fill="#7DB6FF" /><text x="687" y="286">Home 18%</text>
  </g>

  <!-- trend line -->
  <rect x="28" y="404" width="744" height="88" rx="12" fill="#0C121C" stroke="#1E2A3A" />
  <text x="44" y="428" font-family="Inter, sans-serif" font-size="11" fill="#94A3B8">Monthly Revenue Trend (YoY comparison)</text>
  <polyline points="60,478 140,466 220,470 300,450 380,456 460,436 540,442 620,424 700,418"
    fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <polyline points="60,484 140,478 220,480 300,472 380,476 460,466 540,470 620,460 700,458"
    fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="4 4" />
  <g fill="#14B8A6">
    <circle cx="300" cy="450" r="3.5" /><circle cx="460" cy="436" r="3.5" /><circle cx="620" cy="424" r="3.5" />
  </g>
</svg>